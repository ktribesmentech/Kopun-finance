<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kopun Finance Manager Online</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:900px;margin:50px auto;padding:20px}.card{background:white;padding:24px;border-radius:14px;box-shadow:0 10px 30px #0001;margin-bottom:16px}input,button{padding:11px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#2147d8;color:#fff;border:0;border-radius:8px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.hidden{display:none}a{color:#2147d8}</style></head><body><div class="wrap"><div class="card"><h1>Kopun Finance Manager Online</h1><p>This is the new server-backed foundation. Create the first business account or log in.</p></div><div id="auth" class="row"><div class="card"><h2>Create Business</h2><input id="company" placeholder="Company name"><input id="name" placeholder="Administrator name"><input id="ru" placeholder="Username"><input id="rp" type="password" placeholder="Password (8+ characters)"><button onclick="register()">Create Account</button></div><div class="card"><h2>Login</h2><input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password"><button onclick="login()">Login</button></div></div><div id="app" class="card hidden"><h2 id="welcome"></h2><p>The online API is connected. The next migration step is wiring each legacy screen to these API endpoints.</p><button onclick="loadCustomers()">Test: Load Customers</button><pre id="out"></pre><p><a href="legacy-offline.html">Open the original offline v3 interface</a></p><button onclick="logout()">Logout</button></div></div><script>
const api='/api';let token=localStorage.getItem('kfm_token')||'';const j=async(url,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(api+url,opt);const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x};
async function register(){try{const x=await j('/auth/register',{method:'POST',body:JSON.stringify({companyName:company.value,name:name.value,username:ru.value,password:rp.value})});token=x.token;localStorage.setItem('kfm_token',token);start()}catch(e){alert(e.message)}}
async function login(){try{const x=await j('/auth/login',{method:'POST',body:JSON.stringify({username:lu.value,password:lp.value})});token=x.token;localStorage.setItem('kfm_token',token);start()}catch(e){alert(e.message)}}
async function start(){try{const x=await j('/me');auth.classList.add('hidden');app.classList.remove('hidden');welcome.textContent='Welcome, '+x.user.name+' — '+x.business.name}catch{logout()}}
async function loadCustomers(){try{out.textContent=JSON.stringify(await j('/customers'),null,2)}catch(e){alert(e.message)}}function logout(){localStorage.removeItem('kfm_token');token='';location.reload()}if(token)start();
</script></body></html>
